; PlatformIO Project Configuration File

[platformio]
default_envs = gen2_nano
; Optional local overlay (uncomment for local-only overrides):
; extra_configs = platformio.local.ini

[env]
framework = arduino
upload_speed = 115200
monitor_speed = 115200
lib_ignore = LiquidCrystal
lib_deps =
    fastled/FastLED @ ^3.6.0
    cameronbrooks11/CRUMBS @ ^0.16.0
    ; TEMPORARY, not for main: contracts main at the merge of
    ; feastorg/bread-crumbs-contracts#50 (bread_refuse.h, RLHT_CAP_REFUSES,
    ; the RLHT field ranges), unreleased. Replace with the release that
    ; carries them before this merges.
    https://github.com/feastorg/bread-crumbs-contracts.git#53ce1278acd3d424d0ef720409822356c9a93957
    br3ttb/PID @ ^1.2.1
    https://github.com/adafruit/MAX6675-library.git
build_flags =
    -DCRUMBS_MAX_HANDLERS=12
    ; override for flashed board address:
    ; -DI2C_ADR=19
    ; enable debug serial output:
    ; -DSLICE_DEBUG=1
    ; boot with the command watchdog armed (ms); default: boots disarmed:
    ; -DRLHT_WATCHDOG_BOOT_MS=5000

[env:nano_base]
platform = atmelavr
board = nanoatmega328new

[env:nanoevery_base]
platform = atmelmegaavr
board = nano_every

[env:gen1_nano]
extends = env:nano_base
build_flags =
    ${env.build_flags}
    -DRLHT_HW_GEN=1

[env:gen2_nano]
extends = env:nano_base
build_flags =
    ${env.build_flags}
    -DRLHT_HW_GEN=2

[env:gen1_nanoevery]
extends = env:nanoevery_base
build_flags =
    ${env.build_flags}
    -DRLHT_HW_GEN=1

[env:gen2_nanoevery]
extends = env:nanoevery_base
build_flags =
    ${env.build_flags}
    -DRLHT_HW_GEN=2
