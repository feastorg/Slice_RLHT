; PlatformIO Project Configuration File

[platformio]
default_envs = gen2_nano
; Optional local overlay (uncomment for local-only overrides):
; extra_configs = platformio.local.ini

[env]
framework = arduino
upload_speed = 115200
monitor_speed = 115200
lib_ignore = LiquidCrystal
lib_deps =
    cameronbrooks11/CRUMBS @ ^0.16.0
    cameronbrooks11/bread-crumbs-contracts @ ^0.10.0
    br3ttb/PID @ ^1.2.1
    https://github.com/adafruit/MAX6675-library.git
    cameronbrooks11/bread-slice-core @ ^0.1.0
build_flags =
    -DCRUMBS_MAX_HANDLERS=12
    ; override for flashed board address:
    ; -DI2C_ADR=19
    ; enable debug serial output:
    ; -DSLICE_DEBUG=1
    ; boot with the command watchdog armed (ms); default: boots disarmed:
    ; -DRLHT_WATCHDOG_BOOT_MS=5000

[env:nano_base]
platform = platformio/atmelavr @ 5.3.0
board = nanoatmega328new

[env:nanoevery_base]
platform = platformio/atmelmegaavr @ 1.10.0
board = nano_every

[env:gen1_nano]
extends = env:nano_base
build_flags =
    ${env.build_flags}
    -DRLHT_HW_GEN=1

[env:gen2_nano]
extends = env:nano_base
build_flags =
    ${env.build_flags}
    -DRLHT_HW_GEN=2

[env:gen1_nanoevery]
extends = env:nanoevery_base
build_flags =
    ${env.build_flags}
    -DRLHT_HW_GEN=1

[env:gen2_nanoevery]
extends = env:nanoevery_base
build_flags =
    ${env.build_flags}
    -DRLHT_HW_GEN=2
